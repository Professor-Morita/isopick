<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>磯ピク対戦表</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
/* Layout: one column; setup card stack, then a round screen of court cards read from a few steps away */
:root{
  --bg:#eef2f6; --surface:#ffffff; --ink:#14233a; --muted:#5b6b80; --line:#d3dce6;
  --court:#1d5c9e; --court-ink:#ffffff; --ball:#c8dc2e; --ball-ink:#1d2a06; --rest:#f3e9cf; --rest-ink:#5a4410;
  --font-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  --font-num:"Barlow Condensed","Arial Narrow",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1621; --surface:#172231; --ink:#e7eef7; --muted:#9aabbf; --line:#2a394c;
  --court:#2a6fb8; --court-ink:#ffffff; --ball:#d4e64a; --ball-ink:#1d2a06; --rest:#3a321d; --rest-ink:#f1dfa8; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1621; --surface:#172231; --ink:#e7eef7; --muted:#9aabbf; --line:#2a394c;
  --court:#2a6fb8; --court-ink:#ffffff; --ball:#d4e64a; --ball-ink:#1d2a06; --rest:#3a321d; --rest-ink:#f1dfa8; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.6}
.wrap{max-width:900px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
h1{font-size:1.5rem;font-weight:900;margin:0;text-wrap:balance}
h2{font-size:1.05rem;font-weight:700;margin:0}
.sub{color:var(--muted);font-size:.85rem;margin:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.8rem;color:var(--muted);font-weight:500}
select,input[type=text]{font:inherit;font-size:1rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
button{font:inherit;font-weight:700;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 14px;cursor:pointer}
button.primary{background:var(--court);color:var(--court-ink);border-color:var(--court)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--ball);outline-offset:2px}
button:disabled{opacity:.45;cursor:default}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px}
.chip{display:flex;align-items:center;gap:6px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;font-size:.92rem;cursor:pointer;min-width:0}
.chip input{accent-color:var(--court);width:18px;height:18px;flex:none}
.chip span{overflow-wrap:anywhere}
.chip.on{background:color-mix(in srgb,var(--court) 12%,transparent);border-color:var(--court)}
.mark{font-size:.75rem;color:var(--muted);margin-left:auto;flex:none}
.count{font-family:var(--font-num);font-size:2rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.order{display:flex;flex-wrap:wrap;gap:6px}
.order span{border:1px solid var(--line);border-radius:6px;padding:2px 8px;font-size:.88rem}
.order b{font-family:var(--font-num);margin-right:4px;color:var(--court)}
.msg{font-size:.88rem;color:var(--rest-ink);background:var(--rest);border-radius:8px;padding:8px 10px;margin:0}
/* play */
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.bar .grow{flex:1}
.rnum{font-family:var(--font-num);font-weight:700;font-size:3.4rem;line-height:1;letter-spacing:.01em;font-variant-numeric:tabular-nums}
.rnum small{font-size:1.3rem;color:var(--muted);margin-left:4px}
.rlabel{font-size:.75rem;letter-spacing:.12em;color:var(--muted);font-weight:700}
.courts{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.court{background:var(--court);color:var(--court-ink);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0;position:relative;overflow:hidden}
.court::after{content:"";position:absolute;left:0;right:0;top:50%;border-top:2px dashed color-mix(in srgb,var(--court-ink) 35%,transparent);pointer-events:none}
.court h3{margin:0;font-size:.78rem;letter-spacing:.14em;font-weight:700;opacity:.85}
.pair{font-size:1.45rem;font-weight:900;line-height:1.3;overflow-wrap:anywhere;position:relative;z-index:1}
.vs{align-self:center;background:var(--ball);color:var(--ball-ink);font-family:var(--font-num);font-weight:700;border-radius:999px;padding:0 14px;font-size:1rem;position:relative;z-index:1}
.rest{background:var(--rest);color:var(--rest-ink);border-radius:10px;padding:10px 14px;font-weight:700;overflow-wrap:anywhere}
.nav{display:grid;grid-template-columns:1fr 2fr;gap:10px}
.nav button{padding:16px;font-size:1.1rem}
.next{font-size:.85rem;color:var(--muted)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;font-size:.85rem;width:100%;min-width:520px}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:700;font-size:.75rem}
td.r{font-family:var(--font-num);font-weight:700;font-size:1.05rem;font-variant-numeric:tabular-nums}
tr.cur td{background:color-mix(in srgb,var(--ball) 25%,transparent)}
@media (max-width:480px){.pair{font-size:1.25rem}.rnum{font-size:2.8rem}}
@media (prefers-reduced-motion:no-preference){.court{transition:transform .15s}}
[hidden]{display:none!important}body{margin:0}
</style></head><body>

<div class="wrap">
  <header>
    <h1>磯ピク対戦表</h1>
    <p class="sub" id="srcLabel"></p>
  </header>

  <section id="setup" class="card" aria-labelledby="h-setup">
    <h2 id="h-setup">参加者を決める</h2>
    <div class="row">
      <label class="f">日程
        <select id="date"></select>
      </label>
      <label class="f">調整さんのCSVを読み込む
        <input type="file" id="csv" accept=".csv,text/csv">
      </label>
    </div>
    <p class="sub">○の人にチェックが入っています。当日の欠席や飛び入りに合わせて直してください。</p>
    <div class="people" id="people"></div>
    <div class="row">
      <input type="text" id="guestName" placeholder="当日参加の人の名前" aria-label="当日参加の人の名前">
      <button id="addGuest" type="button">追加</button>
    </div>
  </section>

  <section class="card" aria-labelledby="h-court">
    <h2 id="h-court">コートと番号</h2>
    <div class="row">
      <div><div class="rlabel">参加人数</div><div class="count" id="count">0</div></div>
      <label class="f">使えるコート数
        <select id="courts"></select>
      </label>
      <label class="f">組み合わせ表
        <select id="ver"></select>
      </label>
      <button id="shuffle" type="button">番号を振り直す</button>
    </div>
    <p class="msg" id="warn" hidden></p>
    <div class="order" id="order"></div>
    <button class="primary" id="start" type="button">ラウンド1から始める</button>
  </section>

  <section id="play" class="card" hidden aria-live="polite">
    <div class="bar">
      <div class="grow">
        <div class="rlabel" id="playInfo"></div>
        <div class="rnum" id="rnum"></div>
      </div>
      <button id="toList" type="button">全ラウンド一覧</button>
      <button id="back" type="button">参加者に戻る</button>
    </div>
    <div class="courts" id="courtView"></div>
    <div class="rest" id="restView"></div>
    <div class="next" id="nextView"></div>
    <div class="nav">
      <button id="prev" type="button">← 前</button>
      <button class="primary" id="next" type="button">次のラウンド →</button>
    </div>
    <p class="sub">このページのリンクには、今日の参加者と番号が入っています。共有メニューの「リンクをコピー」で送ると、各自の端末でも同じ組み合わせを見られます。ラウンドは各自で進めてください。</p>
  </section>

  <section id="list" class="card" hidden>
    <div class="bar"><h2 class="grow">全ラウンド一覧</h2><button id="closeList" type="button">ラウンド表示に戻る</button></div>
    <div class="tbl"><table id="listTbl"></table></div>
  </section>
</div>

}
const isYes=m=>m==="◯"||m==="○"||m==="〇";

function applyCSV(text,keep){
  const p=parseCSV(text);
  Object.assign(S,{title:p.title,names:p.names,rows:p.rows});
  if(!keep){S.dateIdx=0;resetPeople()}
}
function resetPeople(){
  const r=S.rows[S.dateIdx];S.checked={};S.guests=[];
  S.names.forEach((n,i)=>{S.checked[n]=r?isYes(r.marks[i]):false});
  S.order=attendees();S.courts=0;S.round=0;S.playing=false;
  const lab=r?r.label:"";S.ver=/地区セン/.test(lab)?"chiku":"main";
}
function attendees(){return [...S.names.filter(n=>S.checked[n]),...S.guests.filter(g=>S.checked[g])]}
function syncOrder(){
  const a=attendees();const set=new Set(a);
  S.order=S.order.filter(n=>set.has(n));
  a.forEach(n=>{if(!S.order.includes(n))S.order.push(n)});
}
function options(n){
  const res={};for(const k of Object.keys(PATTERNS)){const[v,N,C]=k.split(":");if(+N===n){(res[C]=res[C]||[]).push(v)}}
  return res;
}

function renderSetup(){
  $("srcLabel").textContent=S.title||"";
  const ds=$("date");ds.innerHTML="";
  S.rows.forEach((r,i)=>{const o=document.createElement("option");o.value=i;o.textContent=r.label;ds.appendChild(o)});
  ds.value=S.dateIdx;
  const r=S.rows[S.dateIdx];const pe=$("people");pe.innerHTML="";
  const all=[...S.names.map((n,i)=>({n,m:r?r.marks[i]:""})),...S.guests.map(g=>({n:g,m:"当日"}))];
  all.forEach(({n,m},i)=>{
    const l=document.createElement("label");l.className="chip"+(S.checked[n]?" on":"");
    const c=document.createElement("input");c.type="checkbox";c.id="p"+i;c.checked=!!S.checked[n];
    c.addEventListener("change",()=>{S.checked[n]=c.checked;syncOrder();S.courts=0;renderSetup();store()});
    const s=document.createElement("span");s.textContent=n;
    const k=document.createElement("span");k.className="mark";k.textContent=m==="×"?"":m;
    l.append(c,s,k);pe.appendChild(l);
  });
  syncOrder();
  const n=S.order.length;$("count").textContent=n;
  const opt=options(n);const cs=Object.keys(opt).map(Number).sort((a,b)=>a-b);
  const sel=$("courts");sel.innerHTML="";
  cs.forEach(c=>{const o=document.createElement("option");o.value=c;o.textContent=c+"面";sel.appendChild(o)});
  if(!cs.includes(S.courts))S.courts=cs.length?Math.max(...cs.filter(c=>c<=Math.floor(n/4)),cs[0]):0;
  sel.value=S.courts;sel.disabled=!cs.length;
  const vs=$("ver");vs.innerHTML="";const vers=opt[S.courts]||[];
  vers.forEach(v=>{const o=document.createElement("option");o.value=v;o.textContent=VER_NAME[v];vs.appendChild(o)});
  if(!vers.includes(S.ver))S.ver=vers[0]||"main";vs.value=S.ver;vs.disabled=vers.length<2;
  const w=$("warn");
  if(!cs.length){w.hidden=false;w.textContent=n<4?"4人以上を選んでください。":`${n}人の組み合わせ表はまだありません。用意してあるのは4〜18人と20〜24人です。`}
  else w.hidden=true;
  $("start").disabled=!cs.length;
  const od=$("order");od.innerHTML="";
  S.order.forEach((nm,i)=>{const s=document.createElement("span");const b=document.createElement("b");b.textContent=i+1;s.append(b,document.createTextNode(nm));od.appendChild(s)});
}

const pat=()=>PATTERNS[`${S.ver}:${S.order.length}:${S.courts}`];
const nm=i=>S.order[i-1];
function renderPlay(){
  const P=pat();if(!P){S.playing=false;show();return}
  const R=P[S.round];
  const d=S.rows[S.dateIdx];
  $("playInfo").textContent=`${d?d.label+"　":""}${S.order.length}人・${S.courts}面・${VER_NAME[S.ver]}`;
  $("rnum").innerHTML="";$("rnum").append(document.createTextNode("ラウンド "+(S.round+1)));
  const sm=document.createElement("small");sm.textContent="/ "+P.length;$("rnum").appendChild(sm);
  const cv=$("courtView");cv.innerHTML="";
  R.c.forEach(([a,b],ci)=>{
    const d=document.createElement("div");d.className="court";
    const h=document.createElement("h3");h.textContent="コート "+(ci+1);
    const p1=document.createElement("div");p1.className="pair";p1.textContent=a.map(nm).join("・");
    const v=document.createElement("div");v.className="vs";v.textContent="VS";
    const p2=document.createElement("div");p2.className="pair";p2.textContent=b.map(nm).join("・");
    d.append(h,p1,v,p2);cv.appendChild(d);
  });
  $("restView").textContent=R.r.length?"休み："+R.r.map(nm).join("、"):"休み：なし";
  const N=P[S.round+1];
  $("nextView").textContent=N?"次の休み："+(N.r.length?N.r.map(nm).join("、"):"なし"):"これが最後のラウンドです。";
  $("prev").disabled=S.round===0;$("next").disabled=S.round>=P.length-1;
}
function renderList(){
  const P=pat();const t=$("listTbl");t.innerHTML="";
  const hr=t.insertRow();["R",...P[0].c.map((_,i)=>"コート"+(i+1)),"休み"].forEach(h=>{const th=document.createElement("th");th.textContent=h;hr.appendChild(th)});
  P.forEach((R,i)=>{const tr=t.insertRow();if(i===S.round)tr.className="cur";
    const c0=tr.insertCell();c0.className="r";c0.textContent=i+1;
    R.c.forEach(([a,b])=>{tr.insertCell().textContent=a.map(nm).join("・")+" 対 "+b.map(nm).join("・")});
    tr.insertCell().textContent=R.r.map(nm).join("、")||"—"});
}
let view="setup";
function show(){
  const play=S.playing;
  $("setup").hidden=play;document.querySelector('[aria-labelledby="h-court"]').hidden=play;
  $("play").hidden=!play||view==="list";$("list").hidden=!play||view!=="list";
  if(play){view==="list"?renderList():renderPlay()}else renderSetup();
}

$("date").addEventListener("change",e=>{S.dateIdx=+e.target.value;resetPeople();show();store()});
$("csv").addEventListener("change",e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();
  rd.onload=()=>{try{applyCSV(rd.result,false);show();store()}catch(err){const w=$("warn");w.hidden=false;w.textContent=err.message}};rd.readAsText(f,"utf-8")});
$("addGuest").addEventListener("click",()=>{const v=$("guestName").value.trim();if(!v||S.names.includes(v)||S.guests.includes(v))return;
  S.guests.push(v);S.checked[v]=true;$("guestName").value="";S.courts=0;show();store()});
$("guestName").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();$("addGuest").click()}});
$("courts").addEventListener("change",e=>{S.courts=+e.target.value;show();store()});
$("ver").addEventListener("change",e=>{S.ver=e.target.value;store()});
$("shuffle").addEventListener("click",()=>{const a=S.order;for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}show();store()});
$("start").addEventListener("click",()=>{S.playing=true;S.round=0;view="play";show();store();window.scrollTo(0,0)});
$("back").addEventListener("click",()=>{S.playing=false;view="setup";show();store()});
$("prev").addEventListener("click",()=>{if(S.round>0){S.round--;show();store()}});
$("next").addEventListener("click",()=>{const P=pat();if(S.round<P.length-1){S.round++;show();store();window.scrollTo(0,0)}});
$("toList").addEventListener("click",()=>{view="list";show()});
$("closeList").addEventListener("click",()=>{view="play";show()});

/* その日のリンク: #d0-c3-m-0-1-2-g1 (日程番号・面数・版・調整さんの列番号順、gは当日参加) */
function toHash(){
  const idx=S.order.map(n=>{const i=S.names.indexOf(n);return i>=0?String(i):"g"+(S.guests.indexOf(n)+1)});
  return `d${S.dateIdx}-c${S.courts}-${S.ver==="chiku"?"k":"m"}-`+idx.join("-");
}
function fromHash(h){
  const m=/^#?d(\d+)-c(\d+)-([mk])-([\dg-]+)$/.exec(h||"");if(!m)return false;
  applyCSV(DEFAULT_CSV,false);
  S.dateIdx=+m[1];S.courts=+m[2];S.ver=m[3]==="k"?"chiku":"main";
  S.checked={};S.guests=[];S.order=[];
  for(const t of m[4].split("-")){
    if(t[0]==="g"){const g="当日参加"+t.slice(1);S.guests.push(g);S.checked[g]=true;S.order.push(g)}
    else{const n=S.names[+t];if(!n)return false;S.checked[n]=true;S.order.push(n)}
  }
  if(!pat())return false;
  S.playing=true;S.round=0;return true;
}
function setHash(){try{history.replaceState(null,"","#"+toHash())}catch(e){location.hash=toHash()}}
$("start").addEventListener("click",setHash);
window.addEventListener("hashchange",()=>{if(fromHash(location.hash)){view="play";show()}});

if(!fromHash(location.hash)){if(!load()){applyCSV(DEFAULT_CSV,false)}}
view=S.playing?"play":"setup";
show();
</script>
